# ═══════════════════════════════════════════════════════
# Silprodent - Docker Compose
# Listo para Dokploy
# ═══════════════════════════════════════════════════════

services:
  # ── PostgreSQL Database ───────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dentibot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentibot_secure_2024}
      POSTGRES_DB: ${POSTGRES_DB:-dentibot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentibot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dentinet

  # ── Backend (FastAPI + Frontend SPA) ──────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dentibot:dentibot_secure_2024@db:5432/dentibot}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production-please-2024}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000}
      BOT_API_KEY: ${BOT_API_KEY:-dev-bot-key-change-in-prod}
      # Password inicial de los usuarios del panel. Si no se definen, el seed
      # genera una al azar y la muestra UNA vez en el log del arranque.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RECEPCION_PASSWORD: ${RECEPCION_PASSWORD:-}
      # Cascada de proveedores de IA. El codigo la soporta hace rato pero estas
      # variables no se pasaban, asi que en la practica solo funcionaba OpenAI:
      # si fallaba, el paciente recibia el mensaje de disculpa y nada mas.
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_PROVIDER_2: ${AI_PROVIDER_2:-none}
      AI_PROVIDER_3: ${AI_PROVIDER_3:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE_ID: ${EVOLUTION_INSTANCE_ID:-}
      YCLOUD_API_KEY: ${YCLOUD_API_KEY:-}
      YCLOUD_FROM_PHONE: ${YCLOUD_FROM_PHONE:-}
      # Sin esto el webhook no puede verificar la firma de YCloud y acepta
      # cualquier POST: alcanzaba con conocer la URL para hacerse pasar por
      # cualquier paciente. Faltaba en este archivo, asi que el valor cargado en
      # Dokploy nunca llegaba al contenedor.
      YCLOUD_WEBHOOK_SECRET: ${YCLOUD_WEBHOOK_SECRET:-}
      # Valvula de escape: ponerlo en "false" desactiva la verificacion sin
      # redesplegar, por si algun dia el secreto queda desincronizado.
      YCLOUD_WEBHOOK_ENFORCE: ${YCLOUD_WEBHOOK_ENFORCE:-true}
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    networks:
      - dentinet

  # ── DentiBot (Telegram) ──────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dentibot:dentibot_secure_2024@db:5432/dentibot}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      BOT_PORT: ${BOT_PORT:-8443}
      API_BASE_URL: ${API_BASE_URL:-http://backend:8000}
      BOT_API_KEY: ${BOT_API_KEY:-dev-bot-key-change-in-prod}
    command: ["python", "-m", "bot.telegram_bot"]
    # El healthcheck del Dockerfile consulta /api/health en el 8000, que solo
    # sirve el backend. Heredado acá dejaba el contenedor siempre "unhealthy".
    healthcheck:
      disable: true
    ports:
      - "8443:8443"
    networks:
      - dentinet

networks:
  dentinet:
    driver: bridge

volumes:
  pgdata:
    driver: local
